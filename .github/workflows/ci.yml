name: Client CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || secrets.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION_KEY: ${{ vars.SONAR_ORGANIZATION_KEY || secrets.SONAR_ORGANIZATION_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Validate SonarCloud configuration
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::Set SONAR_PROJECT_KEY in repository Variables or Secrets"; exit 1; }
          test -n "$SONAR_ORGANIZATION_KEY" || { echo "::error::Set SONAR_ORGANIZATION_KEY in repository Variables or Secrets"; exit 1; }
          test -n "$SONAR_TOKEN" || { echo "::error::Set SONAR_TOKEN in repository Secrets"; exit 1; }

      - name: Analyze with SonarQube Cloud
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION_KEY }}
            -Dsonar.sources=src
            -Dsonar.qualitygate.wait=true
